# ════════════════════════════════════════════════════════════════
#  EventCampus API
#  Os valores ${VARIAVEL:padrão} usam a variável de ambiente quando
#  ela existe (no Render) e o padrão quando roda no seu computador.
# ════════════════════════════════════════════════════════════════

# ── Servidor ──────────────────────────────────────────
# O Render informa a porta pela variável PORT
server.port=${PORT:8080}
# 0.0.0.0 = aceita conexões do celular na mesma rede Wi-Fi
server.address=0.0.0.0

# ── PostgreSQL ────────────────────────────────────────
# Local: Postgres da sua máquina (porta 5433). Online: banco do Neon.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/eventcampus_final}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
# poucas conexões: o plano grátis do Neon tem limite
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# ── JPA / Hibernate ───────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ── JSON: datas no formato ISO (2026-10-21 / 19:00:00) ─
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo

# ── JWT ───────────────────────────────────────────────
# Online, defina JWT_SECRET no Render com um texto longo e secreto
jwt.secret=${JWT_SECRET:eventcampus_secret_key_muito_segura_2024_unifan}
jwt.expiration=86400000

# ── CORS ──────────────────────────────────────────────
cors.allowed-origins=${CORS_ORIGINS:*}

# ── Dados de exemplo (usuários de teste com senha 123456) ─
eventcampus.seed=${SEED:true}